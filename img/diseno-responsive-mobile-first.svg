<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Ilustración de un sitio responsive en celular, tablet y escritorio">
  <rect width="800" height="400" fill="#1f3a5f"/>

  <!-- Escritorio -->
  <rect x="120" y="90" width="300" height="190" rx="12" fill="#f5f7fa"/>
  <rect x="120" y="90" width="300" height="26" rx="12" fill="#4a7fb5"/>
  <rect x="145" y="135" width="250" height="12" rx="6" fill="#f2a900"/>
  <rect x="145" y="162" width="115" height="90" rx="6" fill="#a9c7e8"/>
  <rect x="280" y="162" width="115" height="90" rx="6" fill="#a9c7e8"/>
  <rect x="230" y="285" width="80" height="10" rx="5" fill="#4a7fb5"/>

  <!-- Tablet -->
  <rect x="450" y="120" width="150" height="160" rx="10" fill="#f5f7fa"/>
  <rect x="450" y="120" width="150" height="22" rx="10" fill="#4a7fb5"/>
  <rect x="470" y="158" width="110" height="10" rx="5" fill="#f2a900"/>
  <rect x="470" y="180" width="110" height="42" rx="6" fill="#a9c7e8"/>
  <rect x="470" y="232" width="110" height="34" rx="6" fill="#a9c7e8"/>

  <!-- Celular -->
  <rect x="630" y="140" width="80" height="140" rx="10" fill="#f5f7fa"/>
  <rect x="630" y="140" width="80" height="18" rx="10" fill="#4a7fb5"/>
  <rect x="644" y="172" width="52" height="9" rx="4" fill="#f2a900"/>
  <rect x="644" y="190" width="52" height="34" rx="5" fill="#a9c7e8"/>
  <rect x="644" y="232" width="52" height="34" rx="5" fill="#a9c7e8"/>
</svg>
